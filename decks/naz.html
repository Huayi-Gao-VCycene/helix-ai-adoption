<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean-Tech — Naz Karazeybek Pitch Deck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060e0a;color:#e8f5ee;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}

/* ── deck shell ── */
#deck{display:flex;width:100%;max-width:960px;height:540px;border-radius:14px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6)}

/* ── rail ── */
#rail{width:210px;flex-shrink:0;background:rgba(74,222,128,.1);border-right:1px solid rgba(74,222,128,.15);display:flex;flex-direction:column;padding:28px 20px 24px;gap:16px}
#venture-name{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#4ade80;line-height:1.3}
#slide-num{font-size:.75rem;color:rgba(232,245,238,.45)}
#dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(74,222,128,.2);cursor:pointer;transition:background .2s}
.dot.active{background:#4ade80}
#slide-label{margin-top:auto;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(74,222,128,.65);border-top:1px solid rgba(74,222,128,.15);padding-top:14px}

/* ── stage ── */
#stage{flex:1;background:#060e0a;padding:40px 44px;overflow:hidden;position:relative}

/* ── slide components ── */
.eyebrow{font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#60a5fa;margin-bottom:10px}
.slide-title{font-size:2rem;font-weight:700;line-height:1.15;color:#e8f5ee;margin-bottom:8px}
.slide-sub{font-size:.95rem;color:rgba(232,245,238,.6);margin-bottom:28px;line-height:1.5}
.slide-title em{color:#4ade80;font-style:normal}

.stat-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat{background:rgba(74,222,128,.09);border:1px solid rgba(74,222,128,.2);border-radius:10px;padding:16px 20px;flex:1;min-width:120px}
.stat-val{font-size:1.6rem;font-weight:800;color:#4ade80;font-variant-numeric:tabular-nums}
.stat-lab{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(232,245,238,.5);margin-top:4px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.col-card{border-radius:10px;padding:16px 18px}
.col-card.dark{background:rgba(255,100,100,.07);border:1px solid rgba(255,100,100,.18)}
.col-card.green{background:rgba(74,222,128,.09);border:1px solid rgba(74,222,128,.22)}
.col-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.col-card.dark .col-label{color:rgba(255,140,140,.65)}
.col-card.green .col-label{color:#4ade80}
.col-item{font-size:.82rem;color:rgba(232,245,238,.75);margin-bottom:4px;line-height:1.4}

.insight-box{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.22);border-left:3px solid #60a5fa;border-radius:0 10px 10px 0;padding:14px 18px;margin-bottom:16px}
.insight-box p{font-size:.85rem;color:rgba(232,245,238,.85);line-height:1.5}
.insight-box strong{color:#60a5fa}

.phase-list{display:flex;flex-direction:column;gap:10px}
.phase{display:flex;align-items:flex-start;gap:12px}
.phase-num{width:28px;height:28px;border-radius:50%;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.35);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#4ade80;flex-shrink:0}
.phase-body{flex:1}
.phase-title{font-size:.85rem;font-weight:600;color:#e8f5ee;margin-bottom:2px}
.phase-desc{font-size:.75rem;color:rgba(232,245,238,.55)}

.reg-badge{display:inline-block;background:rgba(74,222,128,.15);border:1px solid rgba(74,222,128,.3);border-radius:6px;padding:3px 10px;font-size:.7rem;font-weight:700;color:#4ade80;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}

.ask-box{background:linear-gradient(135deg,rgba(74,222,128,.1),rgba(96,165,250,.07));border:1px solid rgba(74,222,128,.22);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.ask-box h3{font-size:1rem;color:#4ade80;margin-bottom:10px}
.ask-item{font-size:.85rem;color:rgba(232,245,238,.8);padding:6px 0;border-bottom:1px solid rgba(74,222,128,.1);line-height:1.4}
.ask-item:last-child{border:none}
.ask-item::before{content:'→ ';color:#4ade80}

/* ── notes panel ── */
#notes-wrap{width:100%;max-width:960px;margin-top:16px}
#notes-head{font-size:.65rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(74,222,128,.6);margin-bottom:8px}
#notes-body{background:rgba(255,255,255,.04);border:1px solid rgba(74,222,128,.12);border-radius:10px;padding:18px 22px;font-size:.9rem;line-height:1.65;color:rgba(232,245,238,.8)}

/* ── nav ── */
#nav{display:flex;gap:12px;margin-top:14px;justify-content:center}
#nav button{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80;font-size:.85rem;font-weight:600;padding:9px 28px;border-radius:8px;cursor:pointer;transition:background .15s}
#nav button:hover{background:rgba(74,222,128,.2)}
</style>
</head>
<body>

<div id="deck">
  <div id="rail">
    <div id="venture-name">Clean Tech · Naz Karazeybek</div>
    <div id="slide-num"></div>
    <div id="dots"></div>
    <div id="slide-label"></div>
  </div>
  <div id="stage"></div>
</div>

<div id="notes-wrap">
  <div id="notes-head">Script — Say This Out Loud</div>
  <div id="notes-body"></div>
</div>

<div id="nav">
  <button onclick="move(-1)">← Prev</button>
  <button onclick="move(1)">Next →</button>
</div>

<script>
const LABELS = [
  'Opening','The Problem','The Opportunity',
  'Solution','Market Size','Why Now',
  'Discovery Plan','The Ask'
];

const SLIDES = [
`<div class="eyebrow">Pitch Day 2026</div>
<div class="slide-title">Canada has a <em>plastics ban</em> and no simple answer</div>
<div class="slide-sub">Thousands of food-service businesses are legally required to switch away from single-use plastics — right now — and most of them don't know where to start. I'm Naz Karazeybek, and that's the problem I'm building toward.</div>
<div class="stat-row">
  <div class="stat"><div class="stat-val">200K+</div><div class="stat-lab">Affected Food-Service Businesses</div></div>
  <div class="stat"><div class="stat-val">$2B</div><div class="stat-lab">Sustainable Packaging Market (CA)</div></div>
  <div class="stat"><div class="stat-val">Forced</div><div class="stat-lab">Demand — Regulatory Not Optional</div></div>
</div>
<div class="reg-badge">Federal Regulation Active</div>`,

`<div class="eyebrow">The Problem</div>
<div class="slide-title">Businesses <em>must</em> change — but can't find the path</div>
<div class="slide-sub">Canada's single-use plastics ban is already in effect for most items. Small food-service operators are legally exposed but practically lost.</div>
<div class="two-col">
  <div class="col-card dark">
    <div class="col-label">What Businesses Face Today</div>
    <div class="col-item">Legal ban on straws, bags, stir sticks, cutlery, and food-service containers</div>
    <div class="col-item">Alternatives scattered across dozens of suppliers with no curation</div>
    <div class="col-item">Price premium on sustainable options with no quality signal</div>
    <div class="col-item">Risk of fines with no clear compliance guide</div>
  </div>
  <div class="col-card green">
    <div class="col-label">What They Actually Need</div>
    <div class="col-item">One trusted source: "here's what replaces everything you had"</div>
    <div class="col-item">Pre-vetted alternatives at competitive pricing</div>
    <div class="col-item">Compliance guidance so they know they're covered</div>
    <div class="col-item">Easy reorder so the switch stays switched</div>
  </div>
</div>
<div class="insight-box"><p><strong>The core insight:</strong> This isn't a market you have to convince. The regulation creates forced demand. The customer is already looking — they just can't find a trusted solution.</p></div>`,

`<div class="eyebrow">The Opportunity</div>
<div class="slide-title">First mover in the <em>SMB compliance gap</em></div>
<div class="slide-sub">Large chains have procurement teams and supplier relationships. Small food-service businesses — restaurants, food trucks, cafes, bakeries — have neither. They're the underserved segment.</div>
<div class="phase-list">
  <div class="phase"><div class="phase-num">1</div><div class="phase-body"><div class="phase-title">The segment is huge and fragmented</div><div class="phase-desc">200,000+ food-service SMBs in Canada. No brand owns the "sustainable switch" category for this segment.</div></div></div>
  <div class="phase"><div class="phase-num">2</div><div class="phase-body"><div class="phase-title">Timing is the moat</div><div class="phase-desc">Businesses that switch now build habits. The brand that earns their first order earns their ongoing reorders.</div></div></div>
  <div class="phase"><div class="phase-num">3</div><div class="phase-body"><div class="phase-title">Regulatory tailwind compounds</div><div class="phase-desc">The ban expands over time. Early market presence = natural expansion as more items get banned.</div></div></div>
</div>`,

`<div class="eyebrow">The Solution</div>
<div class="slide-title">A <em>sustainable switch kit</em> for food-service</div>
<div class="slide-sub">A direct-to-business platform matching small food-service operators with pre-vetted, affordable sustainable alternatives — one simple order replaces everything they need to change.</div>
<div class="two-col">
  <div class="col-card green">
    <div class="col-label">Core Product</div>
    <div class="col-item">"Switch Kit" — pre-bundled alternatives for the most-banned items</div>
    <div class="col-item">Curated supplier network, tested for quality and price</div>
    <div class="col-item">Compliance checklist included with every order</div>
    <div class="col-item">Reorder subscription to lock in ongoing supply</div>
  </div>
  <div class="col-card green">
    <div class="col-label">Revenue Model</div>
    <div class="col-item">Product margin on curated alternatives (est. 30–45%)</div>
    <div class="col-item">Supplier partnership fees for preferred placement</div>
    <div class="col-item">Subscription reorder for recurring revenue</div>
    <div class="col-item">Compliance advisory add-on (longer term)</div>
  </div>
</div>`,

`<div class="eyebrow">Market Size</div>
<div class="slide-title"><em>$2B</em> opportunity — with regulatory momentum</div>
<div class="slide-sub">This market doesn't need a behaviour change campaign. The government already ran it — it's called a ban.</div>
<div class="stat-row">
  <div class="stat"><div class="stat-val">$35B</div><div class="stat-lab">Canadian Retail Market (Total)</div></div>
  <div class="stat"><div class="stat-val">$2B</div><div class="stat-lab">Sustainable Packaging Alternatives (CA)</div></div>
  <div class="stat"><div class="stat-val">200K+</div><div class="stat-lab">SMB Food-Service Businesses Affected</div></div>
</div>
<div class="insight-box"><p><strong>SOM target:</strong> Ontario food-service SMBs — roughly 60,000 businesses. Capturing 2% of that segment at $500/year average spend = $600K ARR. That's the first milestone.</p></div>`,

`<div class="eyebrow">Why Now</div>
<div class="slide-title">The ban is <em>active</em> — and businesses are scrambling</div>
<div class="slide-sub">Three conditions that make this the right moment to enter.</div>
<div class="phase-list">
  <div class="phase"><div class="phase-num">1</div><div class="phase-body"><div class="phase-title">Regulation is already in force</div><div class="phase-desc">Canada's single-use plastics ban covers straws, bags, stir sticks, cutlery, and food-service containers. Enforcement is escalating. Businesses are no longer in "wait and see" mode.</div></div></div>
  <div class="phase"><div class="phase-num">2</div><div class="phase-body"><div class="phase-title">Market is still fragmented</div><div class="phase-desc">No clear brand owns this category for SMBs. The window to become the default name is open — but not forever.</div></div></div>
  <div class="phase"><div class="phase-num">3</div><div class="phase-body"><div class="phase-title">Expanding scope = expanding market</div><div class="phase-desc">More items are being added to the ban list over time. Building now means the TAM grows with us, not against us.</div></div></div>
</div>`,

`<div class="eyebrow">Discovery Plan</div>
<div class="slide-title">Here's exactly what I'm doing <em>next 30 days</em></div>
<div class="slide-sub">I'm in the discovery stage — and I know it. Here's the disciplined plan.</div>
<div class="phase-list">
  <div class="phase"><div class="phase-num">1</div><div class="phase-body"><div class="phase-title">3 discovery conversations — food-service owners</div><div class="phase-desc">Small restaurants, food trucks, cafes in Ontario. Goal: validate that they feel the pain, don't have a solution, and would pay for one. Looking for "I need this and I would pay for it."</div></div></div>
  <div class="phase"><div class="phase-num">2</div><div class="phase-body"><div class="phase-title">Map the supplier landscape</div><div class="phase-desc">Find 5 Canadian sustainable packaging suppliers. Understand pricing, MOQs, and relationship options. Can we curate better than what businesses find on their own?</div></div></div>
  <div class="phase"><div class="phase-num">3</div><div class="phase-body"><div class="phase-title">Test a landing page</div><div class="phase-desc">One page: "Switch Kit for Food-Service." Measure if business owners click through from a targeted outreach or Google search. Email list as the first signal.</div></div></div>
</div>`,

`<div class="eyebrow">The Ask</div>
<div class="slide-title">Help me <em>move fast</em> on a real market window</div>
<div class="slide-sub">I'm at the beginning — and that's exactly when the right introduction changes everything.</div>
<div class="ask-box">
  <h3>What I'm Looking For</h3>
  <div class="ask-item">Introductions to small food-service business owners I can interview</div>
  <div class="ask-item">Canadian sustainable packaging suppliers or distributor contacts</div>
  <div class="ask-item">Advisors who've built in clean-tech, compliance, or B2B supply</div>
  <div class="ask-item">Feedback: is my framing right, or am I missing something obvious?</div>
</div>
<div class="stat-row">
  <div class="stat"><div class="stat-val">3</div><div class="stat-lab">Interviews Needed to Confirm</div></div>
  <div class="stat"><div class="stat-val">Ontario</div><div class="stat-lab">Starting Market</div></div>
  <div class="stat"><div class="stat-val">Naz K.</div><div class="stat-lab">905447744549</div></div>
</div>`
];

const NOTES = [
  "Hi, I'm Naz Karazeybek. Canada has a federal single-use plastics ban — and it's already in effect. Over two hundred thousand food-service businesses are legally required to switch away from plastics right now. Most of them don't know where to start, can't find a trusted supplier, and are genuinely stressed about compliance. That's the problem I'm exploring, and I'm here today because I think there's a real business in solving it.",

  "Here's what businesses are dealing with. The ban covers straws, bags, stir sticks, cutlery, and food-service containers. The alternatives exist — but they're scattered across dozens of suppliers with no curation, no quality signal, and a price premium that feels random. There's no compliance guide included. Small restaurant owners are googling 'biodegradable takeout containers' at midnight hoping they're making the right call. That's not a solved problem.",

  "The opportunity is in the SMB segment — small restaurants, food trucks, cafes, bakeries. Large chains have procurement teams. SMBs have nothing. And they're the majority of the two-hundred-thousand businesses affected. No brand has stepped up to own this category for them. That white space is where I'm building, and the timing gives a first-mover advantage that won't last forever.",

  "My solution is a Sustainable Switch Kit — a direct-to-business product that pre-bundles alternatives for the most-banned items, curated for quality and price, with a compliance checklist included. You order one thing and your entire plastic lineup is replaced. Revenue comes from product margin on curated alternatives, supplier partnership fees, and a subscription reorder model for ongoing supply.",

  "The market is real. The Canadian sustainable packaging alternatives market is approaching two billion dollars. Ontario alone has around sixty thousand food-service SMBs. My SOM target is two percent of Ontario SMBs at five hundred dollars annual spend — that's six hundred thousand dollars in ARR as the first milestone. And the market expands as the ban expands — more items are being added over time.",

  "Why now? Three reasons. The regulation is already in force — businesses are no longer waiting. The market is still fragmented — there's no default brand for this segment yet. And the ban scope is expanding — building now means the market grows with us. This is a window. I'm not creating demand. I'm meeting demand that the government already created.",

  "I'm in discovery stage and I know it. In the next thirty days: three conversations with food-service business owners to validate the pain and willingness to pay. Mapping five Canadian sustainable packaging suppliers to understand pricing and partnership potential. And a test landing page to measure organic interest. I'm looking for three clear signals that say 'I need this and I would pay for it.' Once I have those, I move.",

  "I'm here for three things. First, introductions: food-service business owners I can interview, or sustainable packaging suppliers who want to talk. Second, advisors — anyone who's built in clean-tech, B2B supply, or compliance. Third, honest feedback: is my framing right, or am I missing something obvious? I'm at the beginning — and that's exactly when the right conversation changes the trajectory. Thank you."
];

let cur = 0;
const total = SLIDES.length;

function render() {
  document.getElementById('stage').innerHTML = SLIDES[cur];
  document.getElementById('slide-num').textContent = (cur+1) + ' / ' + total;
  document.getElementById('slide-label').textContent = LABELS[cur];
  document.getElementById('notes-body').textContent = NOTES[cur];
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===cur));
}

function move(d) {
  cur = (cur + d + total) % total;
  render();
}

const dotsEl = document.getElementById('dots');
for(let i=0;i<total;i++){
  const d = document.createElement('div');
  d.className='dot';
  d.onclick = ()=>{ cur=i; render(); };
  dotsEl.appendChild(d);
}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight'||e.key==='ArrowDown') move(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') move(-1);
});

render();
</script>
</body>
</html>
